<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Плавающий калькулятор</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;color:#1d1f23;background:#fff}
.mono{font-family:'IBM Plex Mono',monospace}
.stage{width:1280px;height:900px;box-sizing:border-box;background:#e9ebee;position:relative;overflow:hidden}
.back{position:absolute;left:0;top:0;width:1280px;height:900px;background:#fff;opacity:.55}
.cap{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#4a4d55;margin-bottom:12px}
.win{width:340px;background:#fff;border:1.5px solid #1d1f23;box-shadow:0 22px 48px rgba(29,31,35,.34);position:relative}
.win:after{content:"";position:absolute;top:-1.5px;right:-1.5px;width:8px;height:60px;background:#e3000f}
.bar{height:48px;background:#1d1f23;color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px}
.bar b{font-size:16px;font-weight:600}
.sp{flex:1}
.grip{display:grid;grid-template-columns:repeat(2,4px);gap:3px;margin-right:6px}
.grip i{display:block;width:4px;height:4px;background:#8a8d95}
.tb{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;line-height:1}
.tb.pin.on,.pin.on{background:#e3000f}
.wtabs{display:flex;border-bottom:1px solid #e4e5e8}
.wtabs span{flex:1;text-align:center;padding:12px 0;font-size:15px;font-weight:600;color:#4a4d55}
.wtabs span.on{color:#1d1f23;box-shadow:inset 0 -3px 0 #e3000f}
.disp{padding:14px 18px 10px;text-align:right;background:#f6f6f7}
.hist{font-size:14px;color:#4a4d55;min-height:20px}
.val{font-size:44px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.pad{display:grid;grid-template-columns:repeat(4,1fr)}
.k{height:60px;border:0;border-top:1px solid #e4e5e8;border-left:1px solid #e4e5e8;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:22px;color:#1d1f23}
.k:nth-child(4n+1){border-left:0}
.k.op{background:#f6f6f7;color:#e3000f;font-weight:500}
.k.fn{color:#4a4d55;font-size:18px}
.k.eq{background:#e3000f;color:#fff}
.foot{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;color:#4a4d55;border-top:1px solid #e4e5e8}
.dot{width:8px;height:8px;background:#e3000f;display:block}
.tools{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border:1.5px solid #c6c8cd;font-size:14px;font-weight:600;color:#4a4d55}
.chip.on{border-color:#1d1f23;color:#1d1f23;box-shadow:inset 0 -3px 0 #e3000f}
.row{display:flex;flex-direction:column;gap:6px}
.row label{font-size:13px;font-weight:600;letter-spacing:.02em;color:#4a4d55}
.inp{height:46px;border:1.5px solid #c6c8cd;display:flex;align-items:center;padding:0 14px;font-size:18px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:0;background:#1d1f23;color:#fff}
.res div{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.res span{font-size:13px;color:#c6c8cd}
.res b{font-size:22px;font-weight:500}
.ins{display:flex;align-items:center;justify-content:center;min-height:48px;background:#e3000f;color:#fff;font-weight:600;font-size:16px;text-decoration:none}
.ins.ghost2{background:#fff;color:#1d1f23;border:1.5px solid #1d1f23}
.pill{width:300px;height:52px;background:#1d1f23;color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;box-shadow:0 14px 32px rgba(29,31,35,.34);position:relative}
.pill b{font-size:15px;font-weight:600}
.pill .pv{margin-left:auto;font-size:18px}
.pill .tb{width:30px;height:30px;font-size:16px}
</style>
</helmet>
<div class="stage">
<div class="back">
<div style="height:76px;border-bottom:1px solid #e4e5e8;display:flex;align-items:center;padding:0 40px;font-size:34px;font-weight:700;color:#e3000f">ТЭГА<span style="color:#1d1f23"> +</span></div>
<div style="padding:44px 40px;display:flex;flex-direction:column;gap:18px"><div style="height:18px;width:260px;background:#d9dbe0"></div><div style="height:46px;width:640px;background:#cfd2d8"></div><div style="height:16px;width:520px;background:#d9dbe0"></div><div style="height:16px;width:480px;background:#d9dbe0"></div><div style="height:260px;width:1100px;background:#eceef1;margin-top:20px"></div></div>
</div>
<div style="position:absolute;left:40px;top:110px"><div class="cap">Обычный</div><div class="win"><div class="bar"><span class="grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><b>Калькулятор</b><span class="sp"></span><span class="tb pin on" title="Закрепить поверх всех окон"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><path d="M10 1.8l4.2 4.2-2 .6-2.6 2.6.2 3.2-1 1L5.6 9.6 2.2 13l-.4-.4 3.4-3.4L2.2 6.2l1-1 3.2.2L9 2.8z"/></svg></span><span class="tb">−</span><span class="tb">×</span></div><div class="wtabs"><span class="on">Обычный</span><span class="">Стройка</span></div><div class="disp"><div class="hist mono">1 250 × 2,7 =</div><div class="val mono">3 375</div></div><div class="pad"><button class="k fn" type="button" aria-label="C">C</button><button class="k fn" type="button" aria-label="⌫">⌫</button><button class="k fn" type="button" aria-label="%">%</button><button class="k op" type="button" aria-label="÷">÷</button><button class="k" type="button" aria-label="7">7</button><button class="k" type="button" aria-label="8">8</button><button class="k" type="button" aria-label="9">9</button><button class="k op" type="button" aria-label="×">×</button><button class="k" type="button" aria-label="4">4</button><button class="k" type="button" aria-label="5">5</button><button class="k" type="button" aria-label="6">6</button><button class="k op" type="button" aria-label="−">−</button><button class="k" type="button" aria-label="1">1</button><button class="k" type="button" aria-label="2">2</button><button class="k" type="button" aria-label="3">3</button><button class="k op" type="button" aria-label="+">+</button><button class="k" type="button" aria-label="±">±</button><button class="k" type="button" aria-label="0">0</button><button class="k" type="button" aria-label=",">,</button><button class="k eq" type="button" aria-label="=">=</button></div><div class="foot mono"><span class="dot"></span>Закреплён поверх всех окон</div></div></div>
<div style="position:absolute;left:470px;top:110px"><div class="cap">Стройка</div><div class="win"><div class="bar"><span class="grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><b>Калькулятор</b><span class="sp"></span><span class="tb pin on" title="Закрепить поверх всех окон"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><path d="M10 1.8l4.2 4.2-2 .6-2.6 2.6.2 3.2-1 1L5.6 9.6 2.2 13l-.4-.4 3.4-3.4L2.2 6.2l1-1 3.2.2L9 2.8z"/></svg></span><span class="tb">−</span><span class="tb">×</span></div><div class="wtabs"><span class="">Обычный</span><span class="on">Стройка</span></div>
<div class="tools">
<div class="chips"><span class="chip on">Площадь</span><span class="chip">Объём</span><span class="chip">Диагональ</span><span class="chip">Уклон</span><span class="chip">Запас, %</span></div>
<div class="row"><label>Длина, м</label><div class="inp mono">5,0</div></div>
<div class="row"><label>Ширина, м</label><div class="inp mono">4,0</div></div>
<div class="res"><div><span>Площадь</span><b class="mono">20,0 м²</b></div><div><span>Периметр</span><b class="mono">18,0 м</b></div></div>
<a class="ins" href="#">Вставить в расчёт</a>
<a class="ins ghost2" href="#">Показать на калькуляторе</a>
</div><div class="foot mono"><span class="dot"></span>Закреплён поверх всех окон</div></div></div>
<div style="position:absolute;left:900px;top:110px"><div class="cap">Свёрнут</div><div class="pill"><span class="grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><b>Калькулятор</b><span class="pv mono">3 375</span><span class="pin on tb"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><path d="M10 1.8l4.2 4.2-2 .6-2.6 2.6.2 3.2-1 1L5.6 9.6 2.2 13l-.4-.4 3.4-3.4L2.2 6.2l1-1 3.2.2L9 2.8z"/></svg></span><span class="tb">▢</span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
