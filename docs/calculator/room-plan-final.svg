<text x="190" y="40">2500</text><text x="299" y="40">1400</text><text x="369" y="40">1100</text></g>
<text x="438" y="192" transform="rotate(-90 438 192)" font-family="IBM Plex Mono, monospace" font-size="12" fill="#1d1f23" text-anchor="middle">4000</text>

<!-- легенда -->
<g><path d="M20 408h22" stroke="#e3000f" stroke-width="4"/><text x="50" y="412" font-family="Onest, sans-serif" font-size="12" fill="#1d1f23">откосы: укажите ширину отделываемой части</text></g>
